---
development:
  dialect: "mysql"
  url: "mysql://creaves:creaves@(localhost:3306)/creaves?parseTime=true&multiStatements=true&readTimeout=3s"
  # Cap the dev pool: pop defaults to Pool=0 (unlimited open) + IdlePool=2,
  # so every concurrency burst (resync goroutine + webhook pusher + UI)
  # permanently pins connections until MySQL's 8h wait_timeout fires, and
  # repeated e2e runs exhaust max_connections (Error 1040).
  # NB: pop v6 ConnectionDetails has no yaml tags, so only lowercased Go
  # field names are parsed (snake_case keys would be silently ignored).
  pool: 25
  idlepool: 5
  connmaxlifetime: 10m
  connmaxidletime: 1m

test:
  dialect: "mysql"
  # readTimeout must exceed the legitimately slow exports/dashboard queries
  # the suite runs against production-scale fixture data (~10k animals):
  # go-sql-driver kills a connection when a single read exceeds the deadline,
  # and the killed connection then surfaces as "invalid connection"/500 in
  # whichever request reuses it — the bugs.md #10 order-dependent failures.
  # 3s was under water for the DISTINCT/ORDER BY export queries under -race;
  # 60s only bounds a genuinely hung query, it is not a wait budget.
  url: "mysql://creaves:creaves@(localhost:3306)/creaves_test?parseTime=true&multiStatements=true&readTimeout=60s"

production:
  dialect: "mysql"
  url: {{envOr "DATABASE_URL" "mysql://creaves:creaves@(localhost:3306)/creaves?parseTime=true&multiStatements=true&readTimeout=3s"}}
 