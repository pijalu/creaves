         di.address AS "Adresse",
         di.postal_code AS "Code postal",
         di.city AS "ville",
         di.email AS "mail",
         di.phone AS "Téléphone",
         CASE WHEN TRIM(di.donation) REGEXP '^[0-9]{1,16}([.,][0-9]{1,2})?$'
     THEN CAST(REPLACE(TRIM(di.donation), ',', '.') AS DECIMAL(18,2)) END AS "Don"
     FROM discoverers AS di
     WHERE CASE WHEN TRIM(di.donation) REGEXP '^[0-9]{1,16}([.,][0-9]{1,2})?$'
     THEN CAST(REPLACE(TRIM(di.donation), ',', '.') AS DECIMAL(18,2)) > 0
     ELSE FALSE END
     ORDER BY YEAR(di.created_at) DESC, DATE(di.created_at), di.firstname, di.lastname, di.address, di.postal_code, di.city;

 # Annexes, statistiques et contrôles
 - name: Annexe_2024
   description: Annexe au rapport 2024
   year_column: "année"
   query: |-
     SELECT distinct
     a.year AS "année",
     CASE
     WHEN s.class="Aves" THEN "Oiseaux"
     WHEN s.`order`="Artiodactyla" THEN "Mammifères non volants"
     WHEN s.`order`="Carnivora" THEN "Mammifères non volants"
     WHEN s.`order`="Castorimorpha" THEN "Mammifères non volants"
     WHEN s.`order`="Caviomorpha" THEN "Mammifères non volants"
     WHEN s.`order`="Érinaceomorphes" THEN "Mammifères non volants"
     WHEN s.`order`="Eulipotyphla" THEN "Mammifères non volants"
     WHEN s.`order`="Lagomorpha" THEN "Mammifères non volants"
     WHEN s.`order`="Muroidea" THEN "Mammifères non volants"
     WHEN s.`order`="Musteloidea" THEN "Mammifères non volants"
     WHEN s.`order`="Pecora" THEN "Mammifères non volants"
     WHEN s.`order`="Rodentia" THEN "Mammifères non volants"
     WHEN s.`order`="Suina" THEN "Mammifères non volants"
     WHEN s.`order`="Viverroidea" THEN "Mammifères non volants"
     WHEN s.`order`="Chiroptera" THEN "Mammifères volants et autres espèces"
     WHEN s.class="Reptilia" THEN "Mammifères volants et autres espèces"
     WHEN s.class="Amphibia" THEN "Mammifères volants et autres espèces"
     ELSE "Non classé"
     END AS "Rapport Groupe",
     COUNT(Distinct a.id) AS "Nombre"
     FROM animals AS a
     LEFT JOIN (
     SELECT creaves_species, MIN(ID) AS species_id
     FROM species
     GROUP BY creaves_species
     HAVING COUNT(*) = 1
     ) AS sm ON sm.creaves_species = a.species
     LEFT JOIN species AS s ON s.ID = sm.species_id
     LEFT JOIN outtakes AS o ON a.outtake_id = o.id
     LEFT JOIN outtaketypes AS oo ON o.outtaketype_id = oo.id
     Where COALESCE(oo.error, 0) = 0
     GROUP BY 1, 2
     ORDER BY 1 DESC;

 - name: entry_age
   description: Admissions par âge à l’entrée
   year_column: "Année"
   query: |-
     SELECT
         YEAR(i.date) AS "Année",
         COALESCE(NULLIF(TRIM(aa.name), ''), 'Non renseigné') AS "Age à l'Entrée",
         COUNT(*) AS "Nombre",
         SUM(COUNT(*)) OVER (PARTITION BY YEAR(i.date)) AS "Total annuel",
         ROUND(100.0 * COUNT(*) / NULLIF(SUM(COUNT(*)) OVER (PARTITION BY YEAR(i.date)), 0), 2) AS "Pourcentage annuel"
     FROM animals AS a
     JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN outtakes AS o ON o.id = a.outtake_id
     LEFT JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
     LEFT JOIN animalages AS aa ON aa.id = a.animalage_id
     WHERE COALESCE(ot.error, 0) = 0
     GROUP BY 1, 2
     ORDER BY 1 DESC, 3 DESC, 2 ASC;

 - name: sortie_reason
   description: Causes de sortie
   year_column: "Année"
   query: |-
     SELECT
     YEAR(o.date) AS "Année",
     ot.name AS "Causes de sortie",
     CASE
         WHEN o.id IS NULL THEN NULL
         WHEN i.date IS NULL OR o.date IS NULL OR o.date < i.date THEN 'Non déterminée'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN '-12H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN '12-24H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN '24-48H'
         ELSE '+48H'
     END AS "Tranche de séjour",
     COUNT(*) AS "Nombre"
     From animals AS a
     LEFT JOIN intakes AS i ON i.id = a.intake_id
     INNER JOIN outtakes AS o ON a.outtake_id = o.id
     INNER JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
     WHERE ot.error = 0
     GROUP BY 1, 2, 3
     ORDER BY 1 DESC, 2 ASC, FIELD(`Tranche de séjour`, '-12H', '12-24H', '24-48H', '+48H', 'Non déterminée');

 - name: sortie_types
   description: Types de sortie
   year_column: "Année"
   query: |-
     SELECT
     YEAR(o.date) AS "Année",
     CASE
     WHEN oo.rating=-1 THEN "Animal sorti Mort"
     WHEN oo.rating=0 THEN "La sortie est Neutre"
     WHEN oo.rating=1 THEN "Animal sorti Vivant"
     ELSE "Non classé"
     END AS "Type de sortie",
     CASE
         WHEN o.id IS NULL THEN NULL
         WHEN i.date IS NULL OR o.date IS NULL OR o.date < i.date THEN 'Non déterminée'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN '-12H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN '12-24H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN '24-48H'
         ELSE '+48H'
     END AS "Tranche de séjour",
     COUNT(*) AS "Nombre"
     From animals AS a
     LEFT JOIN intakes AS i ON i.id = a.intake_id
     INNER JOIN outtakes AS o ON a.outtake_id = o.id
     LEFT JOIN outtaketypes AS oo ON o.outtaketype_id = oo.id
     WHERE oo.error = 0
     GROUP BY 1, 2, 3
     ORDER BY 1 DESC, 2 ASC, FIELD(`Tranche de séjour`, '-12H', '12-24H', '24-48H', '+48H', 'Non déterminée');

 - name: entry_date_year
