 - name: annual_species_summary
   description: Bilan annuel par espèce avec issues, âges et causes d’entrée
   year_column: "Année d’admission"
   query: |-
     SELECT
         b.admission_year AS "Année d’admission",
         b.species AS "Espèce",
         CASE WHEN b.admission_year = YEAR(CURRENT_DATE)
              THEN DATE_FORMAT(CURRENT_DATE, '%d/%m/%y')
              ELSE CONCAT('31/12/', RIGHT(b.admission_year, 2)) END AS "Date du bilan",
         SUM(b.admissions) AS "Reçus",
         SUM(SUM(b.admissions)) OVER (PARTITION BY b.admission_year) AS "Total annuel des admissions",
         COUNT(*) OVER (PARTITION BY b.admission_year) AS "Nombre annuel d’espèces ou libellés",
         ROUND(100.0 * SUM(b.admissions) / NULLIF(
             SUM(SUM(b.admissions)) OVER (PARTITION BY b.admission_year), 0), 2) AS "Part annuelle de l’espèce (%)",
         SUM(b.present_at_cutoff) AS "Présents à la date du bilan",
         SUM(b.dead_count) AS "Décédés",
         SUM(b.euthanized_count) AS "Euthanasiés",
         SUM(b.released_count) AS "Relâchés",
         SUM(b.transferred_count) AS "Transférés",
         SUM(b.other_outcomes) AS "Autres sorties ou motif non renseigné",
         SUM(b.babies) AS "Bébés",
         SUM(b.juveniles) AS "Juvéniles",
         SUM(b.adults) AS "Adultes",
         SUM(b.other_ages) AS "Autres âges ou âge non renseigné",
         SUM(b.under_12) AS "Sorties -12H",
         SUM(b.from_12) AS "Sorties 12-24H",
         SUM(b.from_24) AS "Sorties 24-48H",
         SUM(b.over_48) AS "Sorties +48H",
         SUM(b.unknown_stay) AS "Sorties avec durée non déterminée",
         JSON_OBJECTAGG(b.entry_cause, b.admissions) AS "Causes principales d’entrée (effectifs)"
     FROM (
         SELECT
             YEAR(i.date) AS admission_year,
             COALESCE(NULLIF(TRIM(a.species), ''), 'Non renseignée') AS species,
             COALESCE(NULLIF(TRIM(ec.cause), ''), 'Non renseignée') AS entry_cause,
             COUNT(*) AS admissions,
             SUM(CASE WHEN (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) THEN 1 ELSE 0 END) AS present_at_cutoff,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND LOWER(TRIM(ot.name)) IN ('dcd', 'décédé', 'decede', 'mort', 'mort à l''arrivée avant l''encodage') THEN 1 ELSE 0 END) AS dead_count,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND LOWER(TRIM(ot.name)) IN ('euthanasier', 'euthanasié', 'euthanasie') THEN 1 ELSE 0 END) AS euthanized_count,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND LOWER(TRIM(ot.name)) IN ('relacher', 'relâcher', 'relâché', 'relache') THEN 1 ELSE 0 END) AS released_count,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND LOWER(TRIM(ot.name)) IN ('transferer', 'transférer', 'transféré', 'transfere') THEN 1 ELSE 0 END) AS transferred_count,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND NOT COALESCE((LOWER(TRIM(ot.name)) IN ('dcd', 'décédé', 'decede', 'mort', 'mort à l''arrivée avant l''encodage') OR LOWER(TRIM(ot.name)) IN ('euthanasier', 'euthanasié', 'euthanasie') OR LOWER(TRIM(ot.name)) IN ('relacher', 'relâcher', 'relâché', 'relache') OR LOWER(TRIM(ot.name)) IN ('transferer', 'transférer', 'transféré', 'transfere')), 0) THEN 1 ELSE 0 END) AS other_outcomes,
             SUM(CASE WHEN LOWER(TRIM(aa.name)) IN ('bébé', 'bebe') THEN 1 ELSE 0 END) AS babies,
             SUM(CASE WHEN LOWER(TRIM(aa.name)) IN ('juvénile', 'juvenile') THEN 1 ELSE 0 END) AS juveniles,
             SUM(CASE WHEN LOWER(TRIM(aa.name)) = 'adulte' THEN 1 ELSE 0 END) AS adults,
             SUM(CASE WHEN NOT COALESCE((LOWER(TRIM(aa.name)) IN ('bébé', 'bebe') OR LOWER(TRIM(aa.name)) IN ('juvénile', 'juvenile') OR LOWER(TRIM(aa.name)) = 'adulte'), 0) THEN 1 ELSE 0 END) AS other_ages,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND TIMESTAMPDIFF(SECOND, i.date, o.date) >= 0 AND TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN 1 ELSE 0 END) AS under_12,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND TIMESTAMPDIFF(SECOND, i.date, o.date) >= 43200 AND TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN 1 ELSE 0 END) AS from_12,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND TIMESTAMPDIFF(SECOND, i.date, o.date) >= 86400 AND TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN 1 ELSE 0 END) AS from_24,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND TIMESTAMPDIFF(SECOND, i.date, o.date) > 172800 THEN 1 ELSE 0 END) AS over_48,
             SUM(CASE WHEN NOT (o.id IS NULL OR YEAR(o.date) > YEAR(i.date) OR o.date > CURRENT_TIMESTAMP) AND (TIMESTAMPDIFF(SECOND, i.date, o.date) IS NULL OR TIMESTAMPDIFF(SECOND, i.date, o.date) < 0) THEN 1 ELSE 0 END) AS unknown_stay
         FROM animals AS a
         JOIN intakes AS i ON i.id = a.intake_id
         LEFT JOIN animalages AS aa ON aa.id = a.animalage_id
         LEFT JOIN discoveries AS d ON d.id = a.discovery_id
         LEFT JOIN entry_causes AS ec ON ec.id = d.entry_cause_id
         LEFT JOIN outtakes AS o ON o.id = a.outtake_id
         LEFT JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
         WHERE COALESCE(ot.error, 0) = 0 AND i.date <= CURRENT_TIMESTAMP
         GROUP BY 1, 2, 3
     ) AS b
     GROUP BY b.admission_year, b.species
     ORDER BY b.admission_year DESC, 4 DESC, b.species;

 - name: animals_species
   description: Admissions par espèce
   year_column: "Année"
   query: |-
     SELECT
         YEAR(i.date) AS "Année",
         COALESCE(NULLIF(TRIM(a.species), ''), 'Non renseigné') AS "Espèce",
         COUNT(*) AS "Nombre",
         SUM(COUNT(*)) OVER (PARTITION BY YEAR(i.date)) AS "Total annuel",
         ROUND(100.0 * COUNT(*) / NULLIF(SUM(COUNT(*)) OVER (PARTITION BY YEAR(i.date)), 0), 2) AS "Pourcentage annuel"
     FROM animals AS a
     JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN outtakes AS o ON o.id = a.outtake_id
     LEFT JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
     WHERE COALESCE(ot.error, 0) = 0
     GROUP BY 1, 2
     ORDER BY 1 DESC, 3 DESC, 2 ASC;

 - name: AGW_group
