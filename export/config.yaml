 - name: outcomes_by_entry_cause_and_species
   description: Issues par cause d’entrée et espèce selon l’année d’admission
   year_column: "Année d’admission"
   query: |-
     SELECT
         counts.admission_year AS "Année d’admission",
         counts.species AS "Espèce",
         counts.entry_cause AS "Cause principale",
         counts.outcome AS "Motif de sortie",
         counts.stay_band AS "Tranche de séjour",
         counts.quantity AS "Nombre",
         SUM(counts.quantity) OVER (PARTITION BY counts.admission_year, counts.species, counts.entry_cause) AS "Total des dossiers clôturés du groupe",
         ROUND(100.0 * counts.quantity / NULLIF(SUM(counts.quantity) OVER (PARTITION BY counts.admission_year, counts.species, counts.entry_cause), 0), 2) AS "Pourcentage"
     FROM (
         SELECT
             YEAR(i.date) AS admission_year,
             COALESCE(NULLIF(TRIM(a.species), ''), 'Non renseignée') AS species,
             COALESCE(NULLIF(TRIM(ec.cause), ''), 'Non renseignée') AS entry_cause,
             ot.name AS outcome,
             CASE
                 WHEN o.id IS NULL THEN NULL
                 WHEN i.date IS NULL OR o.date IS NULL OR o.date < i.date THEN 'Non déterminée'
                 WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN '-12H'
                 WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN '12-24H'
                 WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN '24-48H'
                 ELSE '+48H'
             END AS stay_band,
             COUNT(*) AS quantity
         FROM animals AS a
         JOIN intakes AS i ON i.id = a.intake_id
         LEFT JOIN discoveries AS d ON d.id = a.discovery_id
         JOIN outtakes AS o ON o.id = a.outtake_id
         JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
         LEFT JOIN entry_causes AS ec ON ec.id = d.entry_cause_id
         WHERE ot.error = 0
         GROUP BY 1, 2, 3, 4, 5
     ) AS counts
     ORDER BY counts.admission_year DESC, counts.species, counts.entry_cause, counts.quantity DESC, counts.outcome, FIELD(counts.stay_band, '-12H', '12-24H', '24-48H', '+48H', 'Non déterminée');

 - name: controle_espèce
   description: Animaux avec un nom d'espèce inconnue
   year_column: "Année"
   query: |-
     select a.year AS "Année", a.yearNumber AS "N°", a.species AS "Espèce"
     from animals a
     WHERE NOT EXISTS (SELECT 1 FROM species AS s WHERE s.creaves_species = a.species)

 - name: Nombre
   description: Total des admissions par année
   year_column: "année"
   query: |-
     SELECT YEAR(i.date) AS "année", COUNT(*) AS "Nombre"
     FROM animals AS a
     JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN outtakes AS o ON o.id = a.outtake_id
     LEFT JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
     WHERE COALESCE(ot.error, 0) = 0
     GROUP BY 1
     ORDER BY 1 DESC;

 - name: admissions_by_hour
   description: Admissions par heure et jour de la semaine
   year_column: "Année"
   query: |-
     SELECT YEAR(i.date) AS "Année", WEEKDAY(i.date) + 1 AS "Jour (1 = lundi)",
     HOUR(i.date) AS "Heure", COUNT(*) AS "Admissions"
     FROM animals AS a
     JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN outtakes AS o ON o.id = a.outtake_id
     LEFT JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
     WHERE COALESCE(ot.error, 0) = 0
     GROUP BY 1, 2, 3
     ORDER BY 1 DESC, 2, 3;

