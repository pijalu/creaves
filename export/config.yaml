 - name: entry_causes_by_discovery_municipality
   description: Causes d’entrée par commune de découverte
   year_column: "Année d’admission"
   query: |-
     SELECT
         counts.admission_year AS "Année d’admission",
         counts.country AS "Pays",
         counts.province AS "Province",
         counts.municipality AS "Commune",
         counts.entry_cause AS "Cause principale",
         counts.quantity AS "Nombre",
         SUM(counts.quantity) OVER (PARTITION BY counts.admission_year, counts.country, counts.province, counts.municipality) AS "Total de la commune",
         ROUND(100.0 * counts.quantity / NULLIF(SUM(counts.quantity) OVER (PARTITION BY counts.admission_year, counts.country, counts.province, counts.municipality), 0), 2) AS "Pourcentage"
     FROM (
         SELECT
             YEAR(i.date) AS admission_year,
             COALESCE(geo.country, 'Non déterminé') AS country,
             COALESCE(CASE WHEN geo.country IS NOT NULL THEN geo.province END, 'Non déterminée') AS province,
             COALESCE(CASE WHEN geo.country IS NOT NULL THEN geo.municipality END, 'Non déterminée') AS municipality,
             COALESCE(NULLIF(TRIM(ec.cause), ''), 'Non renseignée') AS entry_cause,
             COUNT(*) AS quantity
         FROM animals AS a
         JOIN intakes AS i ON i.id = a.intake_id
         LEFT JOIN discoveries AS d ON d.id = a.discovery_id
         LEFT JOIN (
             SELECT TRIM(postal_code) AS postal_key, TRIM(locality) AS locality_key,
                 CASE WHEN COUNT(DISTINCT NULLIF(TRIM(country), '')) = 1
                       AND COUNT(NULLIF(TRIM(country), '')) = COUNT(*)
                      THEN MIN(TRIM(country)) END AS country,
                 CASE WHEN COUNT(DISTINCT NULLIF(TRIM(province), '')) = 1
                       AND COUNT(NULLIF(TRIM(province), '')) = COUNT(*)
                      THEN MIN(TRIM(province)) END AS province,
                 CASE WHEN COUNT(DISTINCT NULLIF(TRIM(municipality), '')) = 1
                       AND COUNT(NULLIF(TRIM(municipality), '')) = COUNT(*)
                       AND COUNT(DISTINCT NULLIF(TRIM(province), '')) <= 1
                      THEN MIN(TRIM(municipality)) END AS municipality
             FROM localities
             WHERE NULLIF(TRIM(postal_code), '') IS NOT NULL
               AND NULLIF(TRIM(locality), '') IS NOT NULL
             GROUP BY TRIM(postal_code), TRIM(locality)
         ) AS geo ON geo.postal_key = TRIM(d.postal_code)
                 AND geo.locality_key = TRIM(d.city)
         LEFT JOIN outtakes AS o ON o.id = a.outtake_id
         LEFT JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
         LEFT JOIN entry_causes AS ec ON ec.id = d.entry_cause_id
         WHERE COALESCE(ot.error, 0) = 0
         GROUP BY 1, 2, 3, 4, 5
     ) AS counts
     ORDER BY counts.admission_year DESC, counts.country, counts.province, counts.municipality, counts.quantity DESC, counts.entry_cause;

