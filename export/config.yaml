 - name: outtake_register
   description: Registre des sorties
   year_column: "année"
   query: |-
     SELECT
         a.year AS "année",
         a.id AS "id",
         a.yearNumber AS "numéro annuel",
         class_species.class AS "classe",
         ta.name AS "type",
         a.species AS "espèce",
         aa.name AS "age",
         DATE_FORMAT(i.date, '%d/%m/%y') AS "Date d'entrée",
         DATE_FORMAT(i.date, '%H:%i') AS "Heure d'entrée",
         DATE_FORMAT(o.date, '%d/%m/%y') AS "Date de sortie",
         DATE_FORMAT(o.date, '%H:%i') AS "Heure de sortie",
     ROUND(CASE WHEN o.date >= i.date THEN TIMESTAMPDIFF(SECOND, i.date, o.date) / 3600.0 END, 4) AS "Durée du séjour (heures)",
     CASE
         WHEN o.id IS NULL THEN NULL
         WHEN i.date IS NULL OR o.date IS NULL OR o.date < i.date THEN 'Non déterminée'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN '-12H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN '12-24H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN '24-48H'
         ELSE '+48H'
     END AS "Tranche de séjour",
         oo.code AS "Code de sortie",
         oo.name AS "Motif de sortie",
         oo.description AS "Description du type de sortie",
         oo.rating AS "Classement de sortie",
         oo.dead AS "Animal sorti mort",
         oo.error AS "Sortie de type erreur",
         o.location AS "Lieu de sortie",
         o.precise_location AS "Précision du lieu de sortie",
         o.note AS "Notes de sortie",
         o.stay_duration AS "Durée de séjour enregistrée",
         DATEDIFF(o.date, i.date) + 1 AS "Séjour calculé (jours calendaires)",
         o.corpse_destination AS "Destination du cadavre",
         DATE_FORMAT(o.corpse_destination_at, '%d/%m/%y') AS "Date de destination du cadavre",
         DATE_FORMAT(o.corpse_destination_at, '%H:%i') AS "Heure de destination du cadavre",
         NULLIF(TRIM(CONCAT_WS(' ', u.first_name, u.last_name)), '') AS "Utilisateur ayant encodé la destination"
     FROM animals AS a
     LEFT JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN animaltypes AS ta ON ta.id = a.animaltype_id
     LEFT JOIN (
         SELECT creaves_species, MIN(ID) AS species_id
         FROM species
         GROUP BY creaves_species
         HAVING COUNT(*) = 1
     ) AS class_ref ON class_ref.creaves_species = a.species
     LEFT JOIN species AS class_species ON class_species.ID = class_ref.species_id
     LEFT JOIN animalages AS aa ON aa.id = a.animalage_id
     LEFT JOIN outtakes AS o ON o.id = a.outtake_id
     LEFT JOIN outtaketypes AS oo ON oo.id = o.outtaketype_id
     LEFT JOIN users AS u ON u.id = o.corpse_destination_by_id
     WHERE o.id IS NOT NULL
     ORDER BY a.year DESC, a.yearNumber, a.id;

