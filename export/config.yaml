 - name: medication_administration_register
   description: Registre des médicaments administrés
   year_column: "année"
   query: |-
     SELECT
         a.year AS "année",
         a.id AS "id",
         a.yearNumber AS "numéro annuel",
         class_species.class AS "classe",
         ta.name AS "type",
         a.species AS "espèce",
         aa.name AS "age",
         DATE_FORMAT(i.date, '%d/%m/%y') AS "Date d'entrée",
         DATE_FORMAT(i.date, '%H:%i') AS "Heure d'entrée",
         DATE_FORMAT(t.date, '%d/%m/%y') AS "Date enregistrée du traitement",
         slot.bit_index AS "Position du créneau (0–31)",
         t.drug AS "Médicament",
         t.dosage AS "Posologie saisie",
         t.remarks AS "Remarques"
     FROM treatments AS t
     JOIN animals AS a ON a.id = t.animal_id
     LEFT JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN animaltypes AS ta ON ta.id = a.animaltype_id
     LEFT JOIN (
         SELECT creaves_species, MIN(ID) AS species_id
         FROM species
         GROUP BY creaves_species
         HAVING COUNT(*) = 1
     ) AS class_ref ON class_ref.creaves_species = a.species
     LEFT JOIN species AS class_species ON class_species.ID = class_ref.species_id
     LEFT JOIN animalages AS aa ON aa.id = a.animalage_id
     JOIN (
         SELECT low_bits.n + 8 * high_bits.n AS bit_index
         FROM (
             SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3
             UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7
         ) AS low_bits
         CROSS JOIN (
             SELECT 0 AS n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3
         ) AS high_bits
     ) AS slot ON (t.timedonebitmap & (1 << slot.bit_index)) <> 0
     ORDER BY t.date DESC, t.id, slot.bit_index;

