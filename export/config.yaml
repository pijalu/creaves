queries:

 # Annexes 2A et 2B
 - name: Annexe_2A
   description: Annexe 2A (Animaux accueillis)
   year_column: "année"
   query: |-
     SELECT distinct
         a.id AS "ID",
         a.year AS "année",
         a.yearNumber AS "N°",
         a.species AS "Espèce",
         CASE
     WHEN s.subside_group="SG3" THEN "A) Mammifères non volants"
     WHEN s.subside_group="SG1" THEN "B) Rapaces, oiseaux d’eau, échassiers ou limicoles"
     WHEN s.subside_group="SG2" THEN "C) Autres oiseaux et chauves-souris, batraciens et reptiles"
     END AS "Groupe",
         DATE_FORMAT(i.date, '%d/%m/%y') AS "Date d'Entrée",
         DATE_FORMAT(i.date, '%H:%i') AS "Heure d'entrée",
         DATE_FORMAT(o.date, '%d/%m/%y') AS "Date de Sortie",
         DATE_FORMAT(o.date, '%H:%i') AS "Heure de sortie",
     ROUND(CASE WHEN o.date >= i.date THEN TIMESTAMPDIFF(SECOND, i.date, o.date) / 3600.0 END, 4) AS "Durée du séjour (heures)",
     CASE
         WHEN o.id IS NULL THEN NULL
         WHEN i.date IS NULL OR o.date IS NULL OR o.date < i.date THEN 'Non déterminée'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN '-12H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN '12-24H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN '24-48H'
         ELSE '+48H'
     END AS "Tranche de séjour",
         DATE_FORMAT(o.date, "%Y") AS "Année de Sortie",
         CASE
     WHEN oo.name="DCD" THEN "DCD"
     WHEN oo.name="Euthanasier" THEN "DCD"
     WHEN oo.name="Mort à l'arrivée avant l'encodage" THEN "DCD"
     WHEN oo.name="Relacher" THEN "Relacher"
     WHEN oo.name="Transferer" THEN "Transferer"
     WHEN oo.name="Adoption" THEN "Adoption"
     ELSE oo.name
     END AS "Raison de la sortie"
     FROM animals AS a
     INNER JOIN intakes AS i ON a.intake_id = i.id
     LEFT JOIN outtakes AS o ON a.outtake_id = o.id
     LEFT JOIN (
     SELECT creaves_species, MIN(ID) AS species_id
     FROM species
     GROUP BY creaves_species
     HAVING COUNT(*) = 1
     ) AS sm ON sm.creaves_species = a.species
     LEFT JOIN species AS s ON s.ID = sm.species_id
     LEFT JOIN outtaketypes AS oo ON o.outtaketype_id = oo.id
     Where s.subside_group IN("SG1","SG2","SG3") AND COALESCE(oo.error, 0) = 0
     ORDER BY a.id desc;

 - name: Annexe_2B
   description: Annexe 2B 2024 (Calcul du subside)
   year_column: "Année"
   query: |-
     SELECT DISTINCT
     a.year AS "Année",
     CASE
     WHEN s.subside_group="SG3" THEN "A) Mammifères non volants"
     WHEN s.subside_group="SG1" THEN "B) Rapaces, oiseaux d’eau, échassiers ou limicoles"
     WHEN s.subside_group="SG2" THEN "C) Autres oiseaux et chauves-souris, batraciens et reptiles"
     END AS "Groupes SUBSIDE",
     COUNT(DISTINCT a.id) AS "Nombre",
     sg.size AS "Taille de tranche du référentiel",
     sg.amount AS "Montant par tranche du référentiel"
     From animals AS a
     LEFT JOIN (
     SELECT creaves_species, MIN(ID) AS species_id
     FROM species
     GROUP BY creaves_species
     HAVING COUNT(*) = 1
     ) AS sm ON sm.creaves_species = a.species
     LEFT JOIN species AS s ON s.ID = sm.species_id
     INNER JOIN intakes AS i ON a.intake_id = i.id
     LEFT JOIN outtakes AS o ON a.outtake_id = o.id
     LEFT JOIN outtaketypes AS oo ON o.outtaketype_id = oo.id
     LEFT JOIN subside_groups AS sg ON sg.id = s.subside_group
     WHERE s.subside_group IN ("SG1","SG2","SG3") AND COALESCE(oo.error, 0) = 0
     GROUP BY 1, 2, sg.size, sg.amount
     ORDER BY 1 DESC;

 # Registres
 - name: register
   description: Registre
   year_column: "année"
   query: |-
     SELECT
         a.year AS "année",
         a.id AS "id",
         a.yearNumber AS "numéro annuel",
         class_species.class AS "classe",
         ta.name AS "type",
         a.species AS "espèce",
         aa.name AS "age",
         DATE_FORMAT(i.date, '%d/%m/%y') AS "Date d'entrée",
         DATE_FORMAT(i.date, "%H:%i") AS "Heure d'entrée",
         a.ring AS "Identification",
         DATE_FORMAT(d.date, '%d/%m/%y') AS "Date de découverte",
         DATE_FORMAT(d.date, '%H:%i') AS "Heure de découverte",
         d.location AS "Lieux / Adresse de découverte",
         d.postal_code AS "Code postal découverte",
         d.city AS "Ville découverte",
         DATE_FORMAT(o.date, '%d/%m/%y') AS "Date de sortie",
         DATE_FORMAT(o.date, '%H:%i') AS "Heure de sortie",
         ROUND(CASE WHEN o.date >= i.date THEN TIMESTAMPDIFF(SECOND, i.date, o.date) / 3600.0 END, 4) AS "Durée du séjour (heures)",
         CASE
             WHEN o.id IS NULL THEN NULL
             WHEN i.date IS NULL OR o.date IS NULL OR o.date < i.date THEN 'Non déterminée'
             WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN '-12H'
             WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN '12-24H'
             WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN '24-48H'
             ELSE '+48H'
         END AS "Tranche de séjour",
         oo.name AS "Motif de sortie",
         o.location AS "Lieu de sortie"
     FROM animals AS a
     LEFT JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN animaltypes AS ta ON ta.id = a.animaltype_id
     LEFT JOIN (
         SELECT creaves_species, MIN(ID) AS species_id
         FROM species
         GROUP BY creaves_species
         HAVING COUNT(*) = 1
     ) AS class_ref ON class_ref.creaves_species = a.species
     LEFT JOIN species AS class_species ON class_species.ID = class_ref.species_id
     LEFT JOIN animalages AS aa ON aa.id = a.animalage_id
     INNER JOIN discoveries AS d ON a.discovery_id = d.id
     LEFT JOIN outtakes AS o ON a.outtake_id = o.id
     LEFT JOIN outtaketypes AS oo ON o.outtaketype_id = oo.id
     WHERE COALESCE(oo.error, 0) = 0

     ORDER BY a.year DESC, a.yearNumber, a.id;

 - name: detail_register
   description: Registre détaillé (Big Export)
   year_column: "année"
   query: |-
     SELECT
         a.year AS "année",
         a.id AS "id",
         a.yearNumber AS "numéro annuel",
         s.class AS "classe",
         ta.name AS "type",
         a.species AS "espèce",
         aa.name AS "age",
         DATE_FORMAT(i.date, '%d/%m/%y') AS "Date d'entrée",
         DATE_FORMAT(i.date, '%H:%i') AS "Heure d’entrée",
         a.ring AS "Identification",
         a.gender AS "Sexe",
         a.zone AS "Zone",
         a.cage AS "Cage",
         DATE_FORMAT(a.IntakeDate, '%d/%m/%y') AS "Date d’entrée sur le dossier animal",
         DATE_FORMAT(a.IntakeDate, '%H:%i') AS "Heure d’entrée sur le dossier animal",
         a.feeding AS "Alimentation",
         a.force_feed AS "Gavage",
         DATE_FORMAT(a.feeding_start, '%d/%m/%y') AS "Date de début de l’alimentation",
         DATE_FORMAT(a.feeding_start, '%H:%i') AS "Heure de début de l’alimentation",
         DATE_FORMAT(a.feeding_end, '%d/%m/%y') AS "Date de fin de l’alimentation",
         DATE_FORMAT(a.feeding_end, '%H:%i') AS "Heure de fin de l’alimentation",
         a.feeding_period AS "Période alimentation enregistrée",
         a.heat_source AS "Source de chaleur",
         a.oxygen AS "Oxygène",
         a.ready_for_release AS "Prêt à être relâché",
         DATEDIFF(i.date, d.date) AS "Délai découverte–admission (jours calendaires)",
         s.creaves_species AS "Nom CREAVES du référentiel",
         s.species AS "Nom dans le référentiel",
         st.name AS "Type associé à l’espèce",
         CASE WHEN sm.matches IS NULL THEN 'Absente du référentiel'
              WHEN sm.matches = 1 THEN 'Correspondance unique' ELSE 'Correspondance ambiguë' END AS "Correspondance espèce",
         s.`order` AS "Ordre",
         s.family AS "Famille",
         s.agw_group AS "Groupe CREAVES",
         s.subside_group AS "Code groupe de subside",
         sg.`group` AS "Libellé du groupe de subside",
         s.game AS "Gibier",
         s.huntable AS "Chassable",
         s.native_status AS "Code du statut d’indigénat",
         ns.status AS "Statut d’indigénat",
         ns.indication AS "Indication du statut",
         ns.precision AS "Précision du statut",
         ns.freeable AS "Relâchable selon le statut",
         DATE_FORMAT(d.date, '%d/%m/%y') AS "Date de découverte",
         DATE_FORMAT(d.date, '%H:%i') AS "Heure de découverte",
         d.city AS "Localité de découverte",
         d.postal_code AS "Code postal de découverte",
         d.location AS "Lieu précis de découverte",
         ec.nature AS "Nature de la cause",
         ec.cause AS "Cause principale",
         ec.detail AS "Cause détaillée",
         ec.indication AS "Indication de la cause",
         d.reason AS "Circonstances de la découverte",
         d.note AS "Notes de découverte",
         d.in_garden AS "À l’adresse du découvreur",
         d.return_habitat AS "Retour dans l’habitat",
         di.firstname AS "Prénom du découvreur",
         di.lastname AS "Nom du découvreur",
         di.address AS "Adresse du découvreur",
         di.postal_code AS "Code postal du découvreur",
         di.city AS "Localité du découvreur",
         di.country AS "Pays du découvreur",
         di.email AS "E-mail du découvreur",
         di.phone AS "Téléphone du découvreur",
         di.return_request AS "Demande de retour au découvreur",
         di.note AS "Notes sur le découvreur",
         i.general AS "État général",
         i.has_wounds AS "Blessures signalées",
         i.wounds AS "Blessures",
         i.has_parasites AS "Parasites signalés",
         i.parasites AS "Parasites",
         i.remarks AS "Remarques d’admission",
         DATE_FORMAT(o.date, '%d/%m/%y') AS "Date de sortie",
         DATE_FORMAT(o.date, '%H:%i') AS "Heure de sortie",
     ROUND(CASE WHEN o.date >= i.date THEN TIMESTAMPDIFF(SECOND, i.date, o.date) / 3600.0 END, 4) AS "Durée du séjour (heures)",
     CASE
         WHEN o.id IS NULL THEN NULL
         WHEN i.date IS NULL OR o.date IS NULL OR o.date < i.date THEN 'Non déterminée'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN '-12H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN '12-24H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN '24-48H'
         ELSE '+48H'
     END AS "Tranche de séjour",
         oo.code AS "Code de sortie",
         oo.name AS "Motif de sortie",
         oo.description AS "Description du type de sortie",
         oo.rating AS "Classement de sortie",
         oo.dead AS "Animal sorti mort",
         oo.error AS "Sortie de type erreur",
         o.location AS "Lieu de sortie",
         o.precise_location AS "Précision du lieu de sortie",
         o.note AS "Notes de sortie",
         o.stay_duration AS "Durée de séjour enregistrée",
         DATEDIFF(o.date, i.date) + 1 AS "Séjour calculé (jours calendaires)",
         o.corpse_destination AS "Destination du cadavre",
         DATE_FORMAT(o.corpse_destination_at, '%d/%m/%y') AS "Date de destination du cadavre",
         DATE_FORMAT(o.corpse_destination_at, '%H:%i') AS "Heure de destination du cadavre",
         NULLIF(TRIM(CONCAT_WS(' ', u.first_name, u.last_name)), '') AS "Utilisateur ayant encodé la destination",
         COALESCE(c.total, 0) AS "Nombre de soins",
         COALESCE(tr.total, 0) AS "Nombre de traitements encodés",
         COALESCE(tr.administrations, 0) AS "Nombre d’administrations enregistrées",
         COALESCE(vv.total, 0) AS "Nombre de visites vétérinaires",
         COALESCE(t.total, 0) AS "Nombre de déplacements",
         COALESCE(t.km, 0) AS "Kilomètres parcourus",
         COALESCE(att.total, 0) AS "Nombre de pièces jointes"
     FROM animals AS a
     LEFT JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN animaltypes AS ta ON ta.id = a.animaltype_id
     LEFT JOIN animalages AS aa ON aa.id = a.animalage_id
     LEFT JOIN discoveries AS d ON d.id = a.discovery_id
     LEFT JOIN entry_causes AS ec ON ec.id = d.entry_cause_id
     LEFT JOIN discoverers AS di ON di.id = d.discoverer_id
     LEFT JOIN outtakes AS o ON o.id = a.outtake_id
     LEFT JOIN outtaketypes AS oo ON oo.id = o.outtaketype_id
     LEFT JOIN users AS u ON u.id = o.corpse_destination_by_id
     LEFT JOIN (
         SELECT creaves_species, MIN(ID) AS species_id, COUNT(*) AS matches
         FROM species
         GROUP BY creaves_species
     ) AS sm ON sm.creaves_species = a.species
     LEFT JOIN species AS s ON s.ID = sm.species_id AND sm.matches = 1
     LEFT JOIN animaltypes AS st ON st.id = s.animaltype_id
     LEFT JOIN native_statuses AS ns ON ns.id = s.native_status
     LEFT JOIN subside_groups AS sg ON sg.id = s.subside_group
     LEFT JOIN (SELECT animal_id, COUNT(*) AS total FROM cares GROUP BY animal_id) AS c ON c.animal_id = a.id
     LEFT JOIN (
         SELECT animal_id, COUNT(*) AS total,
                SUM(BIT_COUNT(timedonebitmap & 4294967295)) AS administrations
         FROM treatments
         GROUP BY animal_id
     ) AS tr ON tr.animal_id = a.id
     LEFT JOIN (SELECT animal_id, COUNT(*) AS total FROM veterinaryvisits GROUP BY animal_id) AS vv ON vv.animal_id = a.id
     LEFT JOIN (SELECT animal_id, COUNT(*) AS total, SUM(distance) AS km FROM travels GROUP BY animal_id) AS t ON t.animal_id = a.id
     LEFT JOIN (SELECT animal_id, COUNT(*) AS total FROM attachments GROUP BY animal_id) AS att ON att.animal_id = a.id
     ORDER BY a.year DESC, a.yearNumber, a.id;

 - name: admission_register
