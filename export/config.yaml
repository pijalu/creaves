 - name: animals_game
   description: Admissions par espèce de gibier
   year_column: "Année"
   query: |-
     SELECT
         YEAR(i.date) AS "Année",
         COALESCE(NULLIF(TRIM(a.species), ''), 'Non renseigné ou ambigu') AS "Espèce",
         COUNT(*) AS "Nombre",
         totals.annual_total AS "Total annuel",
         ROUND(100.0 * COUNT(*) / NULLIF(totals.annual_total, 0), 2) AS "Pourcentage annuel"
     FROM animals AS a
     JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN outtakes AS o ON o.id = a.outtake_id
     LEFT JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
     LEFT JOIN (
         SELECT creaves_species, MIN(ID) AS species_id
         FROM species
         GROUP BY creaves_species
         HAVING COUNT(*) = 1
     ) AS sm ON sm.creaves_species = a.species
     LEFT JOIN species AS sp ON sp.ID = sm.species_id
     JOIN (
         SELECT YEAR(i.date) AS intake_year, COUNT(*) AS annual_total
         FROM animals AS a
         JOIN intakes AS i ON i.id = a.intake_id
         LEFT JOIN outtakes AS o ON o.id = a.outtake_id
         LEFT JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
         WHERE COALESCE(ot.error, 0) = 0
         GROUP BY YEAR(i.date)
     ) AS totals ON totals.intake_year = YEAR(i.date)
     WHERE COALESCE(ot.error, 0) = 0 AND sp.game = 1
     GROUP BY 1, 2, totals.annual_total
     ORDER BY 1 DESC, 3 DESC, 2 ASC;

