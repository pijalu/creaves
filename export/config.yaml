 - name: entry_cause_register
   description: Registre des causes d’entrée
   year_column: "année"
   query: |-
     SELECT
         a.year AS "année",
         a.id AS "id",
         a.yearNumber AS "numéro annuel",
         class_species.class AS "classe",
         ta.name AS "type",
         a.species AS "espèce",
         aa.name AS "age",
         DATE_FORMAT(i.date, '%d/%m/%y') AS "Date d'entrée",
         DATE_FORMAT(i.date, '%H:%i') AS "Heure d'entrée",
         DATE_FORMAT(d.date, '%d/%m/%y') AS "Date de découverte",
         DATE_FORMAT(d.date, '%H:%i') AS "Heure de découverte",
         ec.nature AS "Nature de la cause",
         COALESCE(NULLIF(TRIM(ec.cause), ''), 'Non renseignée') AS "Cause principale",
         ec.detail AS "Cause détaillée",
         ec.indication AS "Indication de la cause",
         d.reason AS "Circonstances de la découverte",
         d.note AS "Notes de découverte"
     FROM animals AS a
     JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN animaltypes AS ta ON ta.id = a.animaltype_id
     LEFT JOIN (
         SELECT creaves_species, MIN(ID) AS species_id
         FROM species
         GROUP BY creaves_species
         HAVING COUNT(*) = 1
     ) AS class_ref ON class_ref.creaves_species = a.species
     LEFT JOIN species AS class_species ON class_species.ID = class_ref.species_id
     LEFT JOIN animalages AS aa ON aa.id = a.animalage_id
     LEFT JOIN discoveries AS d ON d.id = a.discovery_id
     LEFT JOIN entry_causes AS ec ON ec.id = d.entry_cause_id
     LEFT JOIN outtakes AS o ON o.id = a.outtake_id
     LEFT JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
     WHERE COALESCE(ot.error, 0) = 0
     ORDER BY a.year DESC, a.yearNumber, a.id;

 - name: discovery_commune_register
   description: Registre des communes de découverte
   year_column: "année"
   query: |-
     SELECT
         a.year AS "année",
         a.id AS "id",
         a.yearNumber AS "numéro annuel",
         class_species.class AS "classe",
         ta.name AS "type",
         a.species AS "espèce",
         aa.name AS "age",
         DATE_FORMAT(i.date, '%d/%m/%y') AS "Date d'entrée",
         DATE_FORMAT(i.date, '%H:%i') AS "Heure d'entrée",
         DATE_FORMAT(d.date, '%d/%m/%y') AS "Date de découverte",
         DATE_FORMAT(d.date, '%H:%i') AS "Heure de découverte",
         d.city AS "Localité de découverte",
         d.postal_code AS "Code postal de découverte",
         d.location AS "Lieu précis de découverte",
         geo.country AS "Pays",
         geo.region AS "Région",
         geo.province AS "Province",
         geo.municipality AS "Commune",
         geo.locality AS "Localité du référentiel",
         geo.postal_code AS "Code postal du référentiel",
         geo.sub_municipality AS "Sous-commune",
         geo.zoning AS "Zonage",
         geo.direction AS "Direction",
         CASE
             WHEN geo.variants IS NULL THEN 'Introuvable'
             WHEN geo.variants = 1 THEN 'Trouvée'
             ELSE 'Ambiguë'
         END AS "Correspondance dans le référentiel",
         d.note AS "Notes de découverte",
         d.in_garden AS "À l’adresse du découvreur",
         d.return_habitat AS "Retour dans l’habitat"
     FROM animals AS a
     LEFT JOIN intakes AS i ON i.id = a.intake_id
     LEFT JOIN animaltypes AS ta ON ta.id = a.animaltype_id
     LEFT JOIN (
         SELECT creaves_species, MIN(ID) AS species_id
         FROM species
         GROUP BY creaves_species
         HAVING COUNT(*) = 1
     ) AS class_ref ON class_ref.creaves_species = a.species
     LEFT JOIN species AS class_species ON class_species.ID = class_ref.species_id
     LEFT JOIN animalages AS aa ON aa.id = a.animalage_id
     LEFT JOIN discoveries AS d ON d.id = a.discovery_id
     LEFT JOIN (
         SELECT
             postal_code,
             locality,
             COUNT(*) AS variants,
             CASE WHEN COUNT(country) = COUNT(*) AND COUNT(DISTINCT country) = 1 THEN MIN(country) END AS country,
             CASE WHEN COUNT(region) = COUNT(*) AND COUNT(DISTINCT region) = 1 THEN MIN(region) END AS region,
             CASE WHEN COUNT(province) = COUNT(*) AND COUNT(DISTINCT province) = 1 THEN MIN(province) END AS province,
             CASE WHEN COUNT(municipality) = COUNT(*) AND COUNT(DISTINCT municipality) = 1 THEN MIN(municipality) END AS municipality,
             CASE WHEN COUNT(sub_municipality) = COUNT(*) AND COUNT(DISTINCT sub_municipality) = 1 THEN MIN(sub_municipality) END AS sub_municipality,
             CASE WHEN COUNT(zoning) = COUNT(*) AND COUNT(DISTINCT zoning) = 1 THEN MIN(zoning) END AS zoning,
             CASE WHEN COUNT(direction) = COUNT(*) AND COUNT(DISTINCT direction) = 1 THEN MIN(direction) END AS direction
         FROM (
             SELECT DISTINCT
                 NULLIF(TRIM(country), '') AS country,
                 NULLIF(TRIM(region), '') AS region,
                 NULLIF(TRIM(province), '') AS province,
                 NULLIF(TRIM(municipality), '') AS municipality,
                 NULLIF(TRIM(locality), '') AS locality,
                 NULLIF(TRIM(postal_code), '') AS postal_code,
                 sub_municipality,
                 NULLIF(TRIM(zoning), '') AS zoning,
                 NULLIF(TRIM(direction), '') AS direction
             FROM localities
             WHERE NULLIF(TRIM(postal_code), '') IS NOT NULL
               AND NULLIF(TRIM(locality), '') IS NOT NULL
         ) AS reference_rows
         GROUP BY postal_code, locality
     ) AS geo ON geo.postal_code = TRIM(d.postal_code)
             AND geo.locality = TRIM(d.city)
     WHERE d.id IS NOT NULL
     ORDER BY a.year DESC, a.yearNumber, a.id;

