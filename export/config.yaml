 - name: outcomes_by_species
   description: Issues par espèce et année de sortie
   year_column: "Année de sortie"
   query: |-
     SELECT YEAR(o.date) AS "Année de sortie", a.species AS "Espèce",
     ot.name AS "Issue",
     CASE
         WHEN o.id IS NULL THEN NULL
         WHEN i.date IS NULL OR o.date IS NULL OR o.date < i.date THEN 'Non déterminée'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN '-12H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN '12-24H'
         WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN '24-48H'
         ELSE '+48H'
     END AS "Tranche de séjour",
     COUNT(*) AS "Sorties",
     ROUND(AVG(CASE WHEN o.date >= i.date THEN TIMESTAMPDIFF(SECOND, i.date, o.date) / 3600.0 END), 4) AS "Séjour moyen (heures)",
     AVG(CASE WHEN o.date >= i.date THEN DATEDIFF(o.date, i.date) + 1 END) AS "Séjour moyen (jours calendaires)",
     COUNT(CASE WHEN o.date >= i.date THEN 1 END) AS "Séjours inclus dans la moyenne"
     FROM animals AS a
     JOIN intakes AS i ON i.id = a.intake_id
     JOIN outtakes AS o ON o.id = a.outtake_id
     JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
     WHERE ot.error = 0
     GROUP BY 1, 2, 3, 4
     ORDER BY 1 DESC, 2, 3, FIELD(`Tranche de séjour`, '-12H', '12-24H', '24-48H', '+48H', 'Non déterminée');

 - name: outcomes_by_species_and_age
   description: État des sorties par espèce et âge à l’admission
   year_column: "Année de sortie"
   query: |-
     SELECT
         YEAR(o.date) AS "Année de sortie",
         a.species AS "Espèce",
         COALESCE(NULLIF(TRIM(aa.name), ''), 'Non renseigné') AS "Âge à l’admission",
         ot.name AS "Motif de sortie",
         CASE
             WHEN o.id IS NULL THEN NULL
             WHEN i.date IS NULL OR o.date IS NULL OR o.date < i.date THEN 'Non déterminée'
             WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 43200 THEN '-12H'
             WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) < 86400 THEN '12-24H'
             WHEN TIMESTAMPDIFF(SECOND, i.date, o.date) <= 172800 THEN '24-48H'
             ELSE '+48H'
         END AS "Tranche de séjour",
         COUNT(*) AS "Nombre d’animaux"
     FROM animals AS a
     LEFT JOIN intakes AS i ON i.id = a.intake_id
     JOIN outtakes AS o ON o.id = a.outtake_id
     JOIN outtaketypes AS ot ON ot.id = o.outtaketype_id
     LEFT JOIN animalages AS aa ON aa.id = a.animalage_id
     WHERE ot.error = 0
     GROUP BY 1, 2, 3, 4, 5
     ORDER BY 1 DESC, 2, 3, 4, FIELD(`Tranche de séjour`, '-12H', '12-24H', '24-48H', '+48H', 'Non déterminée');

 - name: species_reference_duplicates
   description: Contrôle des noms CREAVES ambigus dans le référentiel
   query: |-
     SELECT creaves_species AS "Nom CREAVES", COUNT(*) AS "Fiches référentiel"
     FROM species
     GROUP BY creaves_species
     HAVING COUNT(*) > 1
     ORDER BY 2 DESC, 1;

 - name: donation_value_control
   description: Contrôle des montants de don à vérifier
   query: |-
     SELECT
         donation AS "Montant brut"
     FROM discoverers
     WHERE NULLIF(TRIM(donation), '') IS NOT NULL
     AND TRIM(donation) NOT REGEXP '^[0-9]{1,16}([.,][0-9]{1,2})?$'
     ORDER BY created_at DESC, id;
