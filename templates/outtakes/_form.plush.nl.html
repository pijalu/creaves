<label>Datum</label>
<div class="input-group md-12">
    <input class=" form-control" id="outtakeDate" name="Outtake.Date" required="required" type="text" value="<%= outtake.DateFormated() %>"
    pattern="(?:19|20)[0-9]{2}/(?:(?:0[1-9]|1[0-2])/(?:0[1-9]|1[0-9]|2[0-9])|(?:(?!02)(?:0[1-9]|1[0-2])/(?:30))|(?:(?:0[13578]|1[02])/31)) (0[0-9]|1[0-9]|2[0-3])(:[0-5][0-9])">
    <div class="input-group-append">
        <div class="input-group-text">
            <i class="fa fa-calendar" aria-hidden="true"></i>
        </div>
    </div>
</div>

<script type="text/javascript">
    $('#outtakeDate').flatpickr({time_24hr:true, enableTime: true, dateFormat:'Y/m/d H:i', maxDate: new Date()});
</script>

<div class="form-group" id="stay-duration-group">
    <button type="button" class="btn btn-sm btn-outline-secondary" id="stay24h">+24h</button>
    <button type="button" class="btn btn-sm btn-outline-secondary" id="stay48h">+48h</button>
    <small class="text-muted ml-2" id="stayDurationText"></small>
</div>
<script>
(function(){
    var intakeStr = '<%= intakeDate %>';
    function parseDate(v){
        var m = (v || '').match(/^(\d{4})\/(\d{2})\/(\d{2}) (\d{2}):(\d{2})$/);
        if (!m) return null;
        return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
    }
    function updateDuration(){
        var it = parseDate(intakeStr), ot = parseDate($('#outtakeDate').val());
        var el = document.getElementById('stayDurationText');
        if (!el) return;
        if (!it || !ot) { el.textContent = ''; return; }
        var h = Math.floor((ot - it) / 3600000);
        if (h < 0) h = 0;
        // Mirror the server-side stayDuration helper: plain hours up to
        // 48h, then "days - leftover hours". Units are localized.
        var dayUnit = '<%= t("outtake.duration.day-unit") %>';
        var hourUnit = '<%= t("outtake.duration.hour-unit") %>';
        if (h <= 48) {
            el.textContent = h + ' ' + hourUnit;
        } else {
            el.textContent = Math.floor(h / 24) + ' ' + dayUnit + ' - ' + (h % 24) + ' ' + hourUnit;
        }
    }
    function setStay(hours){
        var it = parseDate(intakeStr);
        if (!it) return;
        var d = new Date(it.getTime() + hours*3600000);
        function p(n){ return (n<10?'0':'')+n; }
        var v = d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
        var fp = $('#outtakeDate')[0]._flatpickr;
        if (fp) { fp.setDate(v, false); } else { $('#outtakeDate').val(v); }
        updateDuration();
    }
    $('#stay24h').on('click', function(){ setStay(24); });
    $('#stay48h').on('click', function(){ setStay(48); });
    $('#outtakeDate').on('change', updateDuration);
    updateDuration();
})();
</script>

<label>Type</label>
<div class="input-group md-12">
    <%= for (ot) in selectOuttaketype {%>
        <div class="form-check-inline">
            <label class="form-check-label">
                <input type="radio" class="form-check-input" name="TypeID" value="<%= ot.SelectValue() %>" required 
                <%= if ( outtake.IsSelected(ot.SelectValue()) ) { %>
                    <%= "checked" %>
                <% } %>
                >
                <%= ot.SelectLabel() %>
            </label>
        </div>
    <%}%>
</div>

<%= if (outtakeLocationModesJSON) { %>
<div class="form-group" id="outtake-location-group">
    <label for="outtakeLocationFree">Locatie</label>
    <input class="form-control" id="outtakeLocationFree" name="Location" type="text" value="<%= outtake.Location %>">
    <select class="form-control d-none" id="outtakeLocationList" name="Location" disabled></select>
</div>
<div class="form-group d-none" id="outtake-precise-group">
    <label for="outtakePreciseLocation">Precieze locatie</label>
    <input class="form-control" id="outtakePreciseLocation" name="PreciseLocation" type="text" value="<%= outtake.PreciseLocation %>">
</div>
<script id="outtake-location-modes" type="application/json"><%= outtakeLocationModesJSON %></script>
<script id="outtake-location-options" type="application/json"><%= outtakeLocationOptionsJSON %></script>
<script>
(function(){
    var modes = JSON.parse(document.getElementById('outtake-location-modes').textContent || '{}');
    var options = JSON.parse(document.getElementById('outtake-location-options').textContent || '[]');
    var group = document.getElementById('outtake-location-group');
    var free = document.getElementById('outtakeLocationFree');
    var list = document.getElementById('outtakeLocationList');
    var preciseGroup = document.getElementById('outtake-precise-group');
    var precise = document.getElementById('outtakePreciseLocation');
    function applyMode(){
        var checked = document.querySelector('input[name="TypeID"]:checked');
        var mode = checked ? (modes[checked.value] || 'none') : 'none';
        if (mode === 'none') {
            group.classList.add('d-none');
            free.disabled = true; free.value = '';
            list.disabled = true;
            precise.disabled = true; precise.value = '';
        } else if (mode === 'free') {
            group.classList.remove('d-none');
            free.classList.remove('d-none'); free.disabled = false;
            list.classList.add('d-none'); list.disabled = true;
            preciseGroup.classList.remove('d-none');
            precise.disabled = false;
        } else {
            precise.disabled = true; precise.value = '';
            group.classList.remove('d-none');
            free.classList.add('d-none'); free.disabled = true;
            list.classList.remove('d-none'); list.disabled = false;
            list.innerHTML = '';
            options.forEach(function(o){
                var el = document.createElement('option');
                el.value = o.value; el.textContent = o.label;
                list.appendChild(el);
            });
        }
    }
    document.querySelectorAll('input[name="TypeID"]').forEach(function(r){
        r.addEventListener('change', applyMode);
    });
    $(free).autoComplete({
        delay: 250,
        minChars: 1,
        source: function(term, response){
            $.getJSON('/suggestions/outtake_location', { q: term }, function(data){ response(data); });
        }
    });
    applyMode();
})();
</script>
<% } else { %>
<%= f.InputTag("Location") %>
<%= f.InputTag("PreciseLocation") %>
<script>
$('input[name="Location"]').autoComplete({
    delay: 250,
    minChars: 1,
    source: function(term, response){
        $.getJSON('/suggestions/outtake_location', { q: term }, function(data){ response(data); });
    }
});
</script>
<% } %>
