<div class="py-4 mb-2">
  <h3 class="d-inline-block"><%= query.Description %></h3>
</div>

<div class="text-right">
  <a href="/export/view" title="Back to exports"><i class="fas fa-arrow-left"></i> Exports</a>
  &nbsp;
  <a href="/export/csv?query=<%= query.Name %>" target="_new" title="Download as CSV"><i class="fas fa-cloud-download-alt"></i></a>
</div>

<table class="table table-hover table-bordered">
  <thead class="thead-light">
    <%= for (col) in cols { %>
      <th><%= col %></th>
    <% } %>
  </thead>
  <tbody>
    <%= for (row) in rows { %>
      <tr>
        <%= for (cell) in row { %>
          <td class="align-middle"><%= cell %></td>
        <% } %>
      </tr>
    <% } %>
  </tbody>
</table>
