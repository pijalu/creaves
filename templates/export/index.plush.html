<div class="py-4 mb-2">
  <h3 class="d-inline-block"><i class="fas fa-file-csv"></i> <%= t("export.index.title") %></h3>
</div>

<p><%= t("export.index.lead") %></p>

<div class="form-group row">
  <label for="exportYear" class="col-2 col-form-label"><%= t("export.year.label") %></label>
  <div class="col-10 col-md-4">
    <select id="exportYear" class="form-control">
      <option value="" <%= if (selectedYear == "") { %>selected<% } %>><%= t("export.year.all") %></option>
      <%= for (y) in years { %>
        <option value="<%= y.Year %>" <%= if (y.Selected) { %>selected<% } %>><%= y.Year %></option>
      <% } %>
    </select>
  </div>
</div>

<table class="table table-hover table-bordered">
  <thead class="thead-light">
    <th><%= t("export.col.export") %></th>
    <th style="width: 8rem;"><%= t("export.col.view") %></th>
    <th style="width: 8rem;"><%= t("export.col.csv") %></th>
  </thead>
  <tbody>
    <%= for (q) in queries { %>
      <tr>
        <td class="align-middle"><%= q.Description %></td>
        <td class="align-middle">
          <a class="btn btn-primary btn-sm export-link" data-base="/export/view?query=<%= q.Name %>" href="/export/view?query=<%= q.Name %>" title="<%= t("export.view") %> <%= q.Description %>"><i class="fas fa-table"></i> <%= t("export.view") %></a>
        </td>
        <td class="align-middle">
          <a class="btn btn-secondary btn-sm export-link" data-base="/export/csv?query=<%= q.Name %>" href="/export/csv?query=<%= q.Name %>" title="<%= t("export.download") %> <%= q.Description %> (CSV)"><i class="fas fa-file-csv"></i> CSV</a>
        </td>
      </tr>
    <% } %>
  </tbody>
</table>

<script>
    // Single year selection at the top of the page (bugs.md bug 5): the
    // chosen year is appended to the View/CSV link when it is clicked.
    // Empty selection = all years (unmodified link).
    document.querySelectorAll("a.export-link").forEach(function (link) {
      link.addEventListener("click", function () {
        var y = document.getElementById("exportYear").value;
        link.href = link.dataset.base + (y ? "&year=" + encodeURIComponent(y) : "");
      });
    });
</script>
