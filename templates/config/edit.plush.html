<div class="py-4 mb-2">
  <h3 class="d-inline-block">Edit Config: <%= config.Name %></h3>
</div>

<%= formFor(config, {action: configPath({ config_id: config.ID }), method: "PUT"}) { %>
  <%= partial("config/form.html") %>
  <button class="btn btn-success" role="submit">Save</button>
  <%= linkTo("/config/" + config.ID, {class: "btn btn-warning", "data-confirm": "Are you sure?", body: "Cancel"}) %>
<% } %>
