<div class="py-4 mb-2">
  <h3 class="d-inline-block">Nieuwe TODO</h3>
</div>

<%= if (errors) { %>
  <div class="alert alert-danger"><%= errors %></div>
<% } %>

<form action="/todos" method="POST">
  <input type="hidden" name="authenticity_token" value="<%= authenticity_token %>">
  <div class="form-group">
    <label for="description">Description</label>
    <input type="text" class="form-control" id="description" name="description" value="<%= todo.Description %>">
  </div>
  <div class="form-group">
    <label for="todo_date">Date</label>
    <input type="datetime-local" class="form-control" id="todo_date" name="todo_date" value="<%= todo.TodoDate.Format("2006-01-02T15:04") %>">
  </div>
  <div class="form-group">
    <label for="recurrence"><%= t("todos.recurrence") %></label>
    <select class="form-control" id="recurrence" name="recurrence">
      <option value="" <%= if (todo.Recurrence == "") { %>selected<% } %>><%= t("todos.recurrence.none") %></option>
      <option value="weekly" <%= if (todo.Recurrence == "weekly") { %>selected<% } %>><%= t("todos.recurrence.weekly") %></option>
      <option value="monthly" <%= if (todo.Recurrence == "monthly") { %>selected<% } %>><%= t("todos.recurrence.monthly") %></option>
      <option value="yearly" <%= if (todo.Recurrence == "yearly") { %>selected<% } %>><%= t("todos.recurrence.yearly") %></option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Opslaan</button>
  <a class="btn btn-secondary" href="/todos">Annuleren</a>
</form>
