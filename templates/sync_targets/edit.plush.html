<div class="py-4 mb-2">
  <h3 class="d-inline-block">Edit Sync Target — <%= target.Name %></h3>
  <a href="/sync_configuration" class="btn btn-outline-primary btn-sm float-right mt-2">Back to sync configuration</a>
</div>

<%= formFor(target, {action: "/sync_targets/" + target.ID, method: "PUT"}) { %>
  <%= partial("sync_targets/form.html") %>
  <button class="btn btn-success" role="submit">Save</button>
  <%= linkTo("/sync_configuration", {class: "btn btn-warning", body: "Cancel"}) %>
<% } %>
